[alembic]
# path to migration scripts
script_location = backend/migrations

# database url (overridden by alembic env from DATABASE_URL)
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_location = backend/migrations/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for local timezone
timezone = UTC

# max length of characters to apply to the
# version file name
max_version_length = 64

# version file naming convention
# %(version)s %(slug)s
version_file_format = %%(version)04d_%%(slug)s

# the template used to generate migration files
# see https://alembic.sqlalchemy.org/en/latest/templates.html
# for more details
# template = generic

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# see https://alembic.sqlalchemy.org/en/latest/api/config.html
# for more details

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
